<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Выбор цвета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 20px; font-family: -apple-system, system-ui, Roboto, sans-serif;
         background: var(--tg-theme-bg-color, #0E1013); color: var(--tg-theme-text-color, #fff); }
  h2 { font-size: 18px; font-weight: 700; margin: 4px 0 16px; }
  .preview { height: 90px; border-radius: 14px; margin-bottom: 16px; border: 1px solid #333;
             display: flex; align-items: center; justify-content: center; font-weight: 800; }
  input[type=color] { width: 100%; height: 56px; border: none; background: none; border-radius: 12px; cursor: pointer; }
  .hexrow { display: flex; gap: 8px; align-items: center; margin: 12px 0; }
  .hexrow input { flex: 1; font-size: 18px; padding: 12px; border-radius: 12px; border: 1px solid #333;
                  background: #16181c; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
  .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 8px 0 20px; }
  .sw { height: 46px; border-radius: 12px; border: 2px solid #2a2d33; cursor: pointer; }
  button.go { width: 100%; padding: 16px; font-size: 17px; font-weight: 700; border: none;
              border-radius: 14px; background: #FF4A00; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h2 id="title">Выбери цвет</h2>
  <div class="preview" id="preview">#FF4A00</div>
  <input type="color" id="picker" value="#FF4A00">
  <div class="hexrow"><input id="hex" type="text" value="#FF4A00" maxlength="7" placeholder="#RRGGBB"></div>
  <div class="swatches" id="swatches"></div>
  <button class="go" id="go">Выбрать цвет</button>
<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var params = new URLSearchParams(location.search);
  var field = params.get('for') || 'color';
  var labels = { sub_text: 'Цвет текста субтитров', sub_accent: 'Цвет акцента (подсветка слова)',
                 plate: 'Цвет подложки', hook: 'Цвет хук-плашки', cta: 'Цвет CTA-плашки' };
  document.getElementById('title').textContent = labels[field] || 'Выбери цвет';
  var picker = document.getElementById('picker'), hex = document.getElementById('hex'),
      preview = document.getElementById('preview');
  function set(c) { c = c.toUpperCase(); picker.value = c; hex.value = c;
                    preview.style.background = c; preview.textContent = c;
                    preview.style.color = (parseInt(c.slice(1,3),16)*0.3 + parseInt(c.slice(3,5),16)*0.6
                                            + parseInt(c.slice(5,7),16)*0.1) > 140 ? '#000' : '#fff'; }
  picker.oninput = function () { set(picker.value); };
  hex.oninput = function () { if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) set(hex.value); };
  var sw = ['#FFFFFF','#000000','#FF4A00','#FFD700','#00D200','#FF0000','#1E90FF','#9B59B6','#FF69B4','#909090'];
  var cont = document.getElementById('swatches');
  sw.forEach(function (c) { var b = document.createElement('div'); b.className = 'sw';
    b.style.background = c; b.onclick = function () { set(c); }; cont.appendChild(b); });
  set('#FF4A00');
  document.getElementById('go').onclick = function () {
    var payload = JSON.stringify({ for: field, color: picker.value.toUpperCase() });
    if (tg) { tg.sendData(payload); tg.close(); } else { alert(payload); }
  };
</script>
</body>
</html>
