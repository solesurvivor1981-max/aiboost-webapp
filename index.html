<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Выбор цвета</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 18px; font-family: -apple-system, system-ui, Roboto, sans-serif;
         background: var(--tg-theme-bg-color, #0E1013); color: var(--tg-theme-text-color, #fff);
         text-align: center; }
  h2 { font-size: 17px; font-weight: 700; margin: 2px 0 14px; }
  .wheelwrap { position: relative; display: inline-block; touch-action: none; }
  canvas { display: block; border-radius: 50%; }
  #cursor { position: absolute; width: 20px; height: 20px; border: 3px solid #fff; border-radius: 50%;
            box-shadow: 0 0 0 1.5px rgba(0,0,0,.5); transform: translate(-50%,-50%); pointer-events: none; }
  .brow { display: flex; align-items: center; gap: 10px; margin: 16px 2px 8px; }
  .brow span { font-size: 20px; }
  input[type=range] { flex: 1; accent-color: #fff; height: 28px; }
  .preview { height: 64px; border-radius: 14px; margin: 10px 0; border: 1px solid #333;
             display: flex; align-items: center; justify-content: center; font-weight: 800; letter-spacing: 1px; }
  .hex { width: 100%; font-size: 18px; padding: 11px; border-radius: 12px; border: 1px solid #333;
         background: #16181c; color: #fff; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
  button.go { width: 100%; margin-top: 14px; padding: 15px; font-size: 17px; font-weight: 700; border: none;
              border-radius: 14px; background: #FF4A00; color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <h2 id="title">Выбери цвет</h2>
  <div class="wheelwrap" id="wrap">
    <canvas id="wheel" width="300" height="300"></canvas>
    <div id="cursor" style="left:150px;top:150px"></div>
  </div>
  <div class="brow"><span>🌑</span><input type="range" id="bright" min="0" max="100" value="100"><span>☀️</span></div>
  <div class="brow" id="arow" style="display:none"><span>🫥</span><input type="range" id="alpha" min="10" max="100" value="60"><span>⬛</span></div>
  <div class="preview" id="preview">#FF4A00</div>
  <input class="hex" id="hex" type="text" value="#FF4A00" maxlength="7" placeholder="#RRGGBB">
  <button class="go" id="go">Выбрать цвет</button>
<script>
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var field = (new URLSearchParams(location.search)).get('for') || 'color';
  var labels = { sub_text: 'Цвет текста субтитров', sub_accent: 'Цвет акцента (подсветка слова)',
                 plate: 'Цвет подложки', hook: 'Цвет хук-плашки', cta: 'Цвет CTA-плашки' };
  document.getElementById('title').textContent = labels[field] || 'Выбери цвет';

  var cv = document.getElementById('wheel'), ctx = cv.getContext('2d'), R = cv.width / 2;
  var bright = document.getElementById('bright'), hex = document.getElementById('hex'),
      preview = document.getElementById('preview'), cursor = document.getElementById('cursor');
  var useAlpha = (new URLSearchParams(location.search)).get('alpha') === '1';
  var arow = document.getElementById('arow'), alpha = document.getElementById('alpha');
  if (useAlpha) { arow.style.display = 'flex'; document.getElementById('title').textContent += ' + прозрачность'; }
  var curHue = 20, curSat = 1;   // default ~orange

  function hsv2rgb(h, s, v) {
    var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c, r, g, b;
    if (h < 60) { r = c; g = x; b = 0; } else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; } else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; } else { r = c; g = 0; b = x; }
    return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];
  }
  function drawWheel() {
    var img = ctx.createImageData(cv.width, cv.height);
    for (var y = 0; y < cv.height; y++) for (var x = 0; x < cv.width; x++) {
      var dx = x - R, dy = y - R, r = Math.sqrt(dx * dx + dy * dy), i = (y * cv.width + x) * 4;
      if (r <= R) {
        var h = Math.atan2(dy, dx) * 180 / Math.PI; if (h < 0) h += 360;
        var rgb = hsv2rgb(h, Math.min(r / R, 1), 1);
        img.data[i] = rgb[0]; img.data[i + 1] = rgb[1]; img.data[i + 2] = rgb[2]; img.data[i + 3] = 255;
      } else { img.data[i + 3] = 0; }
    }
    ctx.putImageData(img, 0, 0);
  }
  function toHex(rgb) {
    return '#' + rgb.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('').toUpperCase();
  }
  function apply() {
    var v = bright.value / 100, rgb = hsv2rgb(curHue, curSat, v), hx = toHex(rgb);
    hex.value = hx;
    var a = useAlpha ? alpha.value / 100 : 1;
    preview.style.background = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')';
    preview.textContent = hx + (useAlpha ? '  ·  ' + alpha.value + '%' : '');
    preview.style.color = (rgb[0] * 0.3 + rgb[1] * 0.6 + rgb[2] * 0.1) > 140 ? '#000' : '#fff';
    var rad = curSat * R, ang = curHue * Math.PI / 180;
    cursor.style.left = (R + rad * Math.cos(ang)) + 'px';
    cursor.style.top = (R + rad * Math.sin(ang)) + 'px';
  }
  function pickAt(clientX, clientY) {
    var rect = cv.getBoundingClientRect();
    var scale = cv.width / rect.width;
    var dx = (clientX - rect.left) * scale - R, dy = (clientY - rect.top) * scale - R;
    var r = Math.min(Math.sqrt(dx * dx + dy * dy), R);
    var h = Math.atan2(dy, dx) * 180 / Math.PI; if (h < 0) h += 360;
    curHue = h; curSat = r / R; apply();
  }
  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); pickAt(e.clientX, e.clientY); });
  cv.addEventListener('pointermove', function (e) { if (e.buttons) { e.preventDefault(); pickAt(e.clientX, e.clientY); } });
  bright.addEventListener('input', apply);
  if (useAlpha) alpha.addEventListener('input', apply);
  hex.addEventListener('input', function () {
    if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) { preview.style.background = hex.value; preview.textContent = hex.value.toUpperCase(); }
  });
  document.getElementById('go').onclick = function () {
    var c = /^#[0-9a-fA-F]{6}$/.test(hex.value) ? hex.value.toUpperCase() : toHex(hsv2rgb(curHue, curSat, bright.value / 100));
    var obj = { for: field, color: c };
    if (useAlpha) obj.alpha = parseInt(alpha.value);
    var payload = JSON.stringify(obj);
    if (tg) { tg.sendData(payload); tg.close(); } else { alert(payload); }
  };
  drawWheel(); apply();
</script>
</body>
</html>
